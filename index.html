      c.beginPath(); c.moveTo(-u * 1.2, u * 1.3); c.lineTo(-u * 2.8, u * 3); c.lineTo(-u * 2.5, u * 1.2); c.closePath(); c.fill();
      circ(u * 0.7, 0, u * 0.8); c.fillStyle = '#0a1233'; c.fill();
      c.restore();
    }
    function sGlobe() {
      var r = u * 28, rp = rocketPos(T);
      glow(cx, cy, u * 46, 0.3);
      if (rp.z < 0) drawRocket(rp);
      var gg = c.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
      gg.addColorStop(0, A(0.32)); gg.addColorStop(1, 'rgba(5,9,30,0.92)');
      circ(cx, cy, r); c.fillStyle = gg; c.fill(); c.strokeStyle = A(0.8); c.lineWidth = 1.6; c.stroke();
      c.lineWidth = 1; c.strokeStyle = A(0.2);
      for (var k = 0; k < 6; k++) { var ma = k * Math.PI / 6 + T * 0.4; c.beginPath(); c.ellipse(cx, cy, Math.abs(Math.cos(ma)) * r, r, 0, 0, TAU); c.stroke(); }
      [-60, -30, 0, 30, 60].forEach(function (d) {
        var la = d * Math.PI / 180; c.beginPath(); c.ellipse(cx, cy + Math.sin(la) * r, Math.cos(la) * r, Math.cos(la) * r * 0.16, 0, 0, TAU); c.stroke();
      });
      var pts = gpts.map(function (g) {
        var lo = g.lon + T * 0.4; return { x: cx + r * Math.cos(g.lat) * Math.sin(lo), y: cy - r * Math.sin(g.lat), z: Math.cos(g.lat) * Math.cos(lo) };
      });
      for (var i = 0; i < pts.length; i++) {
        var p1 = pts[i], p2 = pts[(i + 5) % pts.length];
        if (p1.z < 0.05 || p2.z < 0.05) continue;
        var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2, ox = (mx - cx) * 0.34, oy = (my - cy) * 0.34 - u * 3;
        c.strokeStyle = A(0.42); c.lineWidth = 1.2; c.beginPath(); c.moveTo(p1.x, p1.y); c.quadraticCurveTo(mx + ox, my + oy, p2.x, p2.y); c.stroke();
        var f = (T * 0.6 + i * 0.17) % 1, m = 1 - f;
        circ(m * m * p1.x + 2 * m * f * (mx + ox) + f * f * p2.x, m * m * p1.y + 2 * m * f * (my + oy) + f * f * p2.y, 1.8); c.fillStyle = '#fff'; c.fill();
      }
      pts.forEach(function (p) { if (p.z < 0.05) return; glow(p.x, p.y, u * 4, 0.7 * p.z); circ(p.x, p.y, 1.6 + p.z * 1.6); c.fillStyle = '#fff'; c.fill(); });
      if (rp.z >= 0) drawRocket(rp);
    }

    var SCENES = [sBook, sWork, sGrowth, sTerms, sAI, sTeam, sSteps, sGlobe];

    function paint(now, dt) {
      c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, cw, ch);
      var sT = (now - sceneT0) / 1000, f = clamp(sT / 0.7, 0, 1);
      FD = f * f * (3 - 2 * f); P = ease(clamp(sT / 1.3, 0, 1));
      c.globalAlpha = FD;
      for (var i = 0; i < dust.length; i++) {
        var d = dust[i], y = ((d.y - T * d.v) % 1 + 1) % 1;
        c.fillStyle = A(0.25 + 0.3 * Math.sin(T * 1.4 + d.p)); c.fillRect(d.x * cw, y * ch, d.s, d.s);
      }
      c.save(); var s0 = 0.9 + 0.1 * P; c.translate(cx, cy); c.scale(s0, s0); c.translate(-cx, -cy);
      SCENES[idx](dt);
      c.restore(); c.globalAlpha = 1;
    }
    function frame(now) {
      if (!on) return;
      raf = requestAnimationFrame(frame);
      var dt = Math.min(0.05, (now - last) / 1000); last = now; T = (now - t0) / 1000;
      paint(now, dt);
    }
    function resize() {
      var w = cv.clientWidth, h = cv.clientHeight;
      if (!w || !h) return;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cw = w; ch = h; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      u = Math.min(w / 1.05, h) / 100; cx = w / 2; cy = h / 2;
      if (on && reduce) paint(performance.now(), 0.016);
    }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(cv.parentNode);
    window.addEventListener('resize', resize);

    return {
      set: function (i, acc) {
        idx = i; sceneT0 = performance.now();
        K = { r: parseInt(acc.slice(1, 3), 16), g: parseInt(acc.slice(3, 5), 16), b: parseInt(acc.slice(5, 7), 16) };
        if (on && reduce) { T = 3; sceneT0 -= 2000; paint(performance.now(), 0.016); }
      },
      start: function () {
        if (on) return; on = true; resize(); t0 = last = performance.now() - 1000;
        if (reduce) { T = 3; sceneT0 = performance.now() - 2000; paint(performance.now(), 0.016); return; }
        sceneT0 = performance.now() + 250;
        raf = requestAnimationFrame(frame);
      },
      stop: function () { on = false; cancelAnimationFrame(raf); },
      resize: resize
    };
  })();

  var lastFocus = null, closeTimer = 0, cur = 0, busy = false, activeId = 0;
  var winN = $('win-n'), winKick = $('win-kick'), winBar = $('win-bar'), winBody = $('win-body');
  var winPrev = $('win-prev'), winNext = $('win-next'), winDots = $('win-dots');
  var canAnim = !reduce && typeof win.animate === 'function';

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* слайд собираем из блоков; каждый блок появляется по очереди (--i) */
  function renderSlide(i, dir, delay) {
    cur = i;
    var s = SLIDES[i], pal = PAL[i % PAL.length];
    win.style.setProperty('--acc', pal.acc);
    winN.textContent = String(i + 1);
    winKick.textContent = 'Слайд ' + (i + 1) + ' / ' + SLIDES.length;
    winTitle.textContent = s.title;
    winBar.style.width = ((i + 1) / SLIDES.length * 100) + '%';
    winBody.style.setProperty('--d', (delay || 0) + 'ms');
    winBody.style.setProperty('--dx', (dir ? dir * 26 : 0) + 'px');
    winBody.textContent = '';
    winBody.scrollTop = 0;
    var n = 0;
    function put(node) { node.classList.add('rv'); node.style.setProperty('--i', n++); winBody.appendChild(node); }
    s.blocks.forEach(function (b) {
      if (b.p) put(el('p', 's-p', b.p));
      else if (b.big) put(el('p', 's-big', b.big));
      else if (b.quote) put(el('p', 's-quote', b.quote));
      else if (b.lead) put(el('p', 's-lead', b.lead));
      else if (b.note) put(el('p', 's-note', b.note));
      else if (b.info) {
        var g = el('div', 's-info');
        b.info.forEach(function (r) { var d = el('div'); d.appendChild(el('small', null, r[0])); d.appendChild(el('b', null, r[1])); d.classList.add('rv'); d.style.setProperty('--i', n++); g.appendChild(d); });
        winBody.appendChild(g);
      } else if (b.ul) {
        var ul = el('ul', 's-list');
        b.ul.forEach(function (t) { var li = el('li', 'rv', t); li.style.setProperty('--i', n++); ul.appendChild(li); });
        winBody.appendChild(ul);
      } else if (b.terms) {
        var tg = el('div', 's-terms');
        b.terms.forEach(function (t) {
          var d = el('div', 's-term rv'); d.style.setProperty('--i', n++);
          d.appendChild(el('span', 'n', String(t[0])));
          var w = el('div'); w.appendChild(el('b', null, t[1])); w.appendChild(el('span', null, t[2]));
          d.appendChild(w); tg.appendChild(d);
        });
        winBody.appendChild(tg);
      } else if (b.ideas) {
        var ig = el('div', 's-ideas');
        b.ideas.forEach(function (t, j) {
          var d = el('div', 's-idea rv'); d.style.setProperty('--i', n++);
          d.appendChild(el('span', 'n', '0' + (j + 1))); d.appendChild(el('span', null, t)); ig.appendChild(d);
        });
        winBody.appendChild(ig);
      }
    });
    Stage.set(i, pal.acc);
    winPrev.disabled = i === 0;
    winNext.disabled = i === SLIDES.length - 1;
    var ds = winDots.children;
    for (var d = 0; d < ds.length; d++) ds[d].setAttribute('aria-current', d === i ? 'true' : 'false');
  }

  SLIDES.forEach(function (s, i) {
    var b = el('button', 'dot'); b.type = 'button';
    b.setAttribute('aria-label', 'Слайд ' + (i + 1) + ': ' + s.title);
    b.style.setProperty('--dc', PAL[i % PAL.length].acc);
    b.addEventListener('click', function () { goSlide(i); });
    winDots.appendChild(b);
  });

  function orbOrigin(id) {
    var u = orbs[id - 1] && orbs[id - 1].userData;
    if (!u || !isFinite(u.sx)) return { x: window.innerWidth / 2, y: window.innerHeight / 2, r: 20 };
    return { x: u.sx, y: u.sy, r: u.sr };
  }
  function flyFrom(o, rect) {
    var dx = o.x - (rect.left + rect.width / 2), dy = o.y - (rect.top + rect.height / 2);
    var sc = clamp(o.r * 2 / rect.width, 0.05, 0.22);
    return 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ')';
  }
  /* два кольца-ударные волны из точки сферы */
  function burst(o, color) {
    if (!canAnim) return;
    [0, 140].forEach(function (delay) {
      var b = el('div', 'burst');
      b.style.setProperty('--c', color);
      b.style.left = o.x + 'px'; b.style.top = o.y + 'px';
      document.body.appendChild(b);
      var a = b.animate([
        { transform: 'scale(' + (o.r / 12).toFixed(2) + ')', opacity: 0.95 },
        { transform: 'scale(' + (o.r / 12 * 5.5).toFixed(2) + ')', opacity: 0 }
      ], { duration: 780, delay: delay, easing: 'cubic-bezier(.15,.7,.3,1)', fill: 'both' });
      a.onfinish = function () { b.remove(); };
    });
  }

  function goSlide(to) {
    if (!modalOpen || busy || to === cur || to < 0 || to >= SLIDES.length) return;
    var dir = to > cur ? 1 : -1;
    activeId = to + 1;
    orbs[to].userData.pulse = 1;
    orbVoice(to + 1, false);
    if (!canAnim) { renderSlide(to, 0, 0); return; }
    busy = true;
    var out = winBody.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(' + (-dir * 22) + 'px)' }], { duration: 150, easing: 'ease-in', fill: 'forwards' });
    out.onfinish = function () {
      out.cancel();
      renderSlide(to, dir, 40);
      busy = false;
    };
  }
  winPrev.addEventListener('click', function () { goSlide(cur - 1); });
  winNext.addEventListener('click', function () { goSlide(cur + 1); });

  var swipeX = null;
  winBody.addEventListener('touchstart', function (e) { swipeX = e.touches[0].clientX; }, { passive: true });
  winBody.addEventListener('touchend', function (e) {
    if (swipeX == null) return;
    var dx = e.changedTouches[0].clientX - swipeX; swipeX = null;
    if (Math.abs(dx) > 60) goSlide(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });

  function openWin(id) {
    clearTimeout(closeTimer);
    if (win.getAnimations) win.getAnimations().forEach(function (a) { a.cancel(); });
    lastFocus = document.activeElement;
    modalOpen = true; busy = false;
    setHover(null);
    activeId = id;
    orbs[id - 1].userData.pulse = 1;
    renderSlide(id - 1, 0, canAnim ? 300 : 0);
    orbVoice(id, true);
    whoosh(true);
    scrim.hidden = false;
    void scrim.offsetWidth;
    scrim.classList.add('open');
    Stage.start(); Stage.resize();
    if (canAnim) {
      var o = orbOrigin(id), rect = win.getBoundingClientRect();
      burst(o, PAL[(id - 1) % PAL.length].acc);
      win.animate([
        { transform: flyFrom(o, rect), opacity: 0, filter: 'blur(10px)', borderRadius: '50%' },
        { opacity: 1, filter: 'blur(2px)', borderRadius: '34px', offset: 0.35 },
        { transform: 'none', opacity: 1, filter: 'blur(0px)', borderRadius: '20px' }
      ], { duration: 780, easing: 'cubic-bezier(.16,1,.3,1)' });
    }
    try { winClose.focus({ preventScroll: true }); } catch (err) { winClose.focus(); }
  }
  function closeWin() {
    if (!modalOpen) return;
    modalOpen = false;
    whoosh(false);
    scrim.classList.remove('open');
    var o = orbOrigin(activeId || 1);
    if (activeId) orbs[activeId - 1].userData.pulse = 0.8;
    activeId = 0;
    if (canAnim) {
      win.getAnimations().forEach(function (a) { a.cancel(); });
      win.animate([
        { transform: 'none', opacity: 1, filter: 'blur(0px)', borderRadius: '20px' },
        { transform: flyFrom(o, win.getBoundingClientRect()), opacity: 0, filter: 'blur(8px)', borderRadius: '50%' }
      ], { duration: 460, easing: 'cubic-bezier(.6,0,.8,.4)', fill: 'forwards' });
    }
    closeTimer = setTimeout(function () {
      if (win.getAnimations) win.getAnimations().forEach(function (a) { a.cancel(); });
      scrim.hidden = true; Stage.stop();
    }, canAnim ? 470 : 0);
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (err) {} }
  }
  winClose.addEventListener('click', closeWin);
  scrim.addEventListener('pointerdown', function (e) { if (e.target === scrim) closeWin(); });
  renderSlide(0, 0, 0);

  /* ---------- цикл отрисовки ---------- */
  var clock = new THREE.Clock();
  var INTRO_MS = 3.8;
  function loop() {
    requestAnimationFrame(loop);
    var dt = Math.min(clock.getDelta(), 0.05), now = clock.elapsedTime;
    uTime.value = now;

    if (!dragging) {
      if (Math.abs(velX) > 1e-5 || Math.abs(velY) > 1e-5) {
        spin(velX * dt * 60, velY * dt * 60);
        var damp = Math.pow(0.92, dt * 60);
        velX *= damp; velY *= damp;
      }
      galaxy.rotateY(0.04 * dt);
    }

    var mul = 2.7;
    if (intro.on) {
      var kk = intro.instant ? 1 : clamp((now - intro.t0) / INTRO_MS, 0, 1);
      mul = 2.7 - 1.7 * (1 - Math.pow(1 - kk, 3));
    }
    zoom += (zoomT - zoom) * Math.min(1, dt * 8);
    audioTick(dt);
    var cz = Math.max(5, baseDist * zoom * mul), pk = Math.min(1, dt * 2.2);
    parX += (mouseX - parX) * pk; parY += (mouseY - parY) * pk;
    camera.position.set(parX * cz * 0.035, -parY * cz * 0.025, cz);
    camera.lookAt(0, 0, 0);

    var W = window.innerWidth, H = window.innerHeight, camZ = camera.position.z;
    for (var i = 0; i < orbs.length; i++) {
      var o = orbs[i], u = o.userData;
      u.angle += dt * 0.02;
      o.position.x = Math.cos(u.angle) * u.radius;
      o.position.z = Math.sin(u.angle) * u.radius;
      o.position.y = u.yOffset + Math.sin(now * u.ySpeed * 40 + u.phase) * 0.35;
      var act = hovered === o || activeId === u.id;
      u.pulse *= Math.exp(-dt * 2.4);
      var tgt = (act ? 1.3 : 1) + u.pulse * 0.32;
      u.s += (tgt - u.s) * Math.min(1, dt * 10);
      o.scale.setScalar(u.s);
      var hu = o.material.uniforms.uHot;
      hu.value += ((act ? 1 : 0) - hu.value) * Math.min(1, dt * 10);
      var gs = (5 + Math.sin(now * 1.6 + u.phase) * 0.45) * (1 + 0.28 * hu.value + 0.5 * u.pulse);
      u.glow.scale.set(gs, gs, 1);
      u.halo.rotation.y += dt * (0.5 + 0.4 * hu.value);
      u.atm.material.uniforms.uHot.value = hu.value;
    }
    var br = 6 + Math.sin(now * 0.7) * 0.14; photon.scale.set(br, br, 1);
    renderer.render(scene, camera);

    /* экранные координаты сфер: по ним ставятся номера, карточка и точка вылета окна */
    for (var j = 0; j < orbs.length; j++) {
      var p = orbs[j], q = p.userData;
      p.getWorldPosition(tmpV).applyMatrix4(camera.matrixWorldInverse);
      var dist = Math.max(0.5, -tmpV.z);
      q.dist = dist;
      q.sx = (tmpV.x / (dist * FOV_TAN * camera.aspect) * 0.5 + 0.5) * W;
      q.sy = (0.5 - tmpV.y / (dist * FOV_TAN) * 0.5) * H;
      q.sr = 0.62 * q.s * (H / 2) / (FOV_TAN * dist);
      var dT = clamp((dist - (camZ - RING_R)) / (2 * RING_R), 0, 1);
      var want = (now > labelsT0 + q.id * 0.11 && hovered !== p && !modalOpen) ? 1 : 0;
      q.lv += (want - q.lv) * Math.min(1, dt * 7);
      var lab = q.lab;
      lab.style.opacity = (q.lv * (1 - 0.45 * dT)).toFixed(3);
      var ls = (1.08 - 0.3 * dT) * (0.75 + 0.25 * q.lv);
      lab.style.transform = 'translate3d(' + q.sx.toFixed(1) + 'px,' + (q.sy - q.sr - 20 * ls).toFixed(1) + 'px,0) scale(' + ls.toFixed(3) + ')';
    }
    if (hovered) placeHover(hovered.userData);
  }
  loop();

  /* ---------- вход: кнопка превращается в тысячи белых кнопок ---------- */
  function startIntro(instant) {
    intro.on = true; intro.instant = !!instant; intro.t0 = clock.elapsedTime;
    enabled = true;
    snd.hidden = false;
    startAmbient();
    labelsT0 = clock.elapsedTime + (instant ? 0.3 : INTRO_MS * 0.8);
    setTimeout(startSignature, instant ? 400 : INTRO_MS * 1000 + 100);
  }

  var entered = false;
  function enter() {
    if (entered) return;
    entered = true;
    initAudio();

    if (reduce) {
      arrivalChime(0.15);
      startEl.hidden = true;
      glCanvas.style.transition = 'opacity 0.4s ease';
      glCanvas.style.opacity = '1';
      startIntro(true);
      return;
    }

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = window.innerWidth, H = window.innerHeight;
    fx.width = Math.round(W * dpr); fx.height = Math.round(H * dpr);
    fx.style.display = 'block';
    var ctx = fx.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#01020a'; ctx.fillRect(0, 0, W, H);

    var br = goBtn.getBoundingClientRect();
    var cx = br.left + br.width / 2, cy = br.top + br.height / 2, bR = br.width / 2;
    startEl.style.visibility = 'hidden';

    var dots = [], TOTAL = small ? 2600 : 4200, spawned = 0;
    var maxD = Math.hypot(W, H) * 1.1;
    var t0 = performance.now(), last = t0, revealed = false;

    function frame(nowMs) {
      var t = nowMs - t0, dt = Math.min(0.05, (nowMs - last) / 1000);
      last = nowMs;

      if (!revealed) {
        ctx.fillStyle = 'rgba(1,2,10,0.2)';
        ctx.fillRect(0, 0, W, H);

        var want = Math.min(TOTAL, Math.floor(TOTAL * clamp(t / 450, 0, 1)));
        while (spawned < want) {
          dots.push({ a: rnd() * Math.PI * 2, d: rnd() * bR * 0.7, v: 60 + rnd() * 130, s: 1.2 + rnd() * 2.8, k: 2.0 + rnd() * 1.6 });
          spawned++;
        }

        var bk = 1 - clamp(t / 700, 0, 1);
        if (bk > 0) {
          ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 40;
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(cx, cy, bR * bk, 0, 6.2832); ctx.fill();
          ctx.shadowBlur = 0;
        }

        ctx.fillStyle = '#fff';
        for (var i = dots.length - 1; i >= 0; i--) {
          var p = dots[i];
          p.d += p.v * dt;
          p.v *= Math.exp(dt * p.k);
          if (p.d > maxD) { dots[i] = dots[dots.length - 1]; dots.pop(); continue; }
          var rad = p.s * (1 + p.d / 520);
          ctx.globalAlpha = 0.92;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(p.a) * p.d, cy + Math.sin(p.a) * p.d, rad, 0, 6.2832);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        var ft = clamp((t - 1250) / 450, 0, 1);
        flash.style.opacity = String(ft * ft);

        if (t >= 1750) {
          revealed = true;
          fx.style.display = 'none';
          startEl.hidden = true;
          glCanvas.style.opacity = '1';
          startIntro(false);
        }
      } else {
        var fo = 1 - clamp((t - 1750) / 900, 0, 1);
        flash.style.opacity = String(fo * fo);
        if (fo <= 0) { flash.style.opacity = '0'; return; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(function (n) { t0 = last = n; warpSound(); frame(n); });
  }
  goBtn.addEventListener('click', enter);
})();
</script>
